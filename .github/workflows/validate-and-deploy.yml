name: Validate Bicep and build documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  BICEP_STORAGE_NAME: stbicepoverviewci
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Bicep CLI without Azure login
        run: |
          az bicep install
          az bicep version
      - name: Compile and lint all sources
        run: python .github/scripts/validate_bicep.py
      - name: Check catalog and compiled behavior
        run: |
          python .github/scripts/generate_catalog.py --check
          python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build strict documentation and check links
        run: |
          python -m mkdocs build --strict
          python .github/scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-bicep
          path: build/
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: site/
  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
